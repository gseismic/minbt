name: 发布到 PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: 测试并构建发行包
    runs-on: ubuntu-latest
    steps:
      - name: 检出发布标签
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 配置 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 安装项目与发布检查依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev,plot]" twine

      - name: 校验 Release 标签与项目版本
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(
              Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]
          expected_tag = f"v{version}"
          actual_tag = os.environ["RELEASE_TAG"]
          if actual_tag != expected_tag:
              raise SystemExit(
                  f"Release 标签必须为 {expected_tag}，实际收到 {actual_tag}"
              )
          print(f"Release 标签与项目版本一致：{actual_tag}")
          PY

      - name: 运行全量测试
        run: python -m pytest -q

      - name: 构建 wheel 和 sdist
        run: python -m build

      - name: 检查发行包
        run: python -m twine check --strict dist/*

      - name: 保存发行包
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: 使用 Trusted Publishing 上传
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/minbt/
    permissions:
      id-token: write
    steps:
      - name: 获取已检查的发行包
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: 发布到 PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
